[package]
name = "shellmind"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.35.1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync"] }
serde = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"
anyhow = "=1.0.79"
thiserror = "=1.0.56"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.31", features = ["serde"] }
dirs = "=5.0.1"
redb = "2"
cron = "0.12"
fastembed = { version = "3", optional = true }

[features]
default = ["bow-embeddings"]
bow-embeddings = []
semantic-embeddings = ["dep:fastembed"]

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.27.1", features = ["process", "signal", "term"] }
